
services:
  # --- Qdrant (Vector DB) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST/HTTP
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333

  # --- App frontend (Next.js + CopilotKit) ---
  bookclub-app:
    image: node:20-alpine
    container_name: bookclub-app
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - bookclub-preprocessing-server
    env_file:
      - ./src/book_club/app/.env
    environment:
      LOGS_FORMAT: ${LOGS_FORMAT}
      LOGS_LEVEL: ${LOGS_LEVEL}
    ports:
      - "8000:8000"
    volumes:
      - ./src/book_club/app:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"

  # --- Preprocessing server backend (FastAPI) ---
  bookclub-preprocessing-server:
    build:
      context: ./src/book_club/
      dockerfile: preprocessing_server/Dockerfile
    container_name: bookclub-preprocessing-server
    restart: unless-stopped
    depends_on:
      - qdrant
      - alloy
    env_file:
      - ./src/book_club/preprocessing_server/.env
    environment:
      # Provide your own model keys in .env (not committed)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      # OTEL: ensure traces reach Alloy -> Tempo (override .env if wrong)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      ENABLE_OTEL_TRACING: "true"
      # prometheus_client requires lowercase env var for multiprocess mode
      prometheus_multiproc_dir: ${PROMETHEUS_MULTIPROC_DIR:-/tmp/prometheus_multiproc_dir} # needs to be in small letters?
      PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/tmp/prometheus_multiproc_dir} # TODO: i'm not sure do i need to keep this in both versions?
      LOGS_FORMAT: ${LOGS_FORMAT:-%(asctime)s - %(name)s - %(levelname)s - %(filename)s - %(lineno)d - %(funcName)s - %(process)d - %(thread)d - %(threadName)s - %(otelTraceID)s - %(otelSpanID)s - %(message)s}
      LOGS_LEVEL: ${LOGS_LEVEL:-INFO}
    ports:
      - "8010:8010"
    volumes:
      - ./storage:/preprocessing_server/storage
      - ./src/book_club/preprocessing_server/logs:/logs
      - ./data/pdfs:/pdfs

  # --- Prometheus (Metrics) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/data:/prometheus

  # --- Pushgateway (Metrics pusher) ---
  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    command: ["--web.enable-admin-api"]

  # --- Loki ( Logs ingestor and processor) ---
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - ./observability/loki/data:/loki

  # --- Tempo (Tracing) ---
  tempo:
    image: grafana/tempo:2.8.0
    container_name: tempo
    restart: unless-stopped
    ports:
      # OTLP gRPC (4317) exposed via Alloy, not Tempo directly
      - "3200:3200"   # Tempo HTTP API
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yaml:ro
    command: ["-config.file=/etc/tempo/tempo.yaml"]

  # --- Alloy ( General ingestor that can handle not only logs) ---
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./logs:/development_logs/ # general development logs
      - ./src/book_club/app/logs:/app_logs/ # app run specific logs
      - ./src/book_club/preprocessing_server/logs:/preprocessing_server/ # server run specific logs
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "12345:12345"  # Alloy UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

  # --- Grafana (Dashboards) ---
  # Dashboards use default datasource (datasource: null) so no uid in provisioning; works with 12.x
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "3000:3000"
    environment:
      # Local defaults; I can change them in .env for non-local
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/data:/var/lib/grafana
      - ./observability/dashboards:/var/lib/grafana/dashboards

networks:
  default:
    name: bookclub-net
