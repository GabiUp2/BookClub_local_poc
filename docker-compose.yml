
services:
  # --- Qdrant (Vector DB) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST/HTTP
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333

  # --- App frontend (Next.js + CopilotKit) ---
  bookclub-app:
    image: node:20-alpine
    container_name: bookclub-app
    restart: unless-stopped
    working_dir: src/book_club/app
    depends_on:
      - bookclub-server
    env_file:
      - ./src/book_club/app/.env
    ports:
      - "8000:8000"
    volumes:
      - ./src/book_club/app:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"

  # --- Server backend (FastAPI) ---
  bookclub-server:
    build:
      context: ./src/book_club/server
      dockerfile: Dockerfile
    container_name: bookclub-server
    restart: unless-stopped
    depends_on:
      - qdrant
    env_file:
      - ./src/book_club/server/.env
    environment:
      # Provide your own model keys in .env (not committed)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    ports:
      - "8010:8010"
    volumes:
      - ./storage:/server/storage
      - ./logs:/server/logs

  # --- Prometheus (Metrics) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/data:/prometheus

  # --- Loki ( Logs ingestor and processor) ---
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - ./observability/loki/data:/loki

  # --- Alloy ( General ingestor that can handle not only logs) ---
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./logs:/development_logs/ # general development logs
      - ./src/book_club/app/logs:/app_logs/ # app run specific logs
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "12345:12345"  # Alloy UI

  # --- Grafana (Dashboards) ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      # Local defaults; I can change them in .env for non-local
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/data:/var/lib/grafana
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards

networks:
  default:
    name: bookclub-net