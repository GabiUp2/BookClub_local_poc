global:
  scrape_interval: 2s

scrape_configs:
  - job_name: 'bookclub-server'
    metrics_path: /metrics
    static_configs:
      - targets: ['bookclub-server:8010']

  - job_name: 'bookclub-app'
    metrics_path: /api/metrics
    scrape_interval: 10s
    scrape_timeout: 9s
    static_configs:
      - targets: ['bookclub-app:8000']

  - job_name: 'qdrant'
    metrics_path: /metrics
    static_configs:
      - targets: ['qdrant:6333']

  - job_name: 'loki'
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: 'alloy'
    metrics_path: /metrics
    static_configs:
      - targets: ['alloy:12345']

  - job_name: 'grafana'
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'tempo'
    metrics_path: /metrics
    static_configs:
      - targets: ['tempo:3200']
