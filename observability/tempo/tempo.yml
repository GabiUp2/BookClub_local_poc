server:
  http_listen_port: 3200
  http_grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  trace_idle_period: 10s
  max_block_bytes: 104857600
  max_block_duration: 5m

compactor:
  compaction:
    compaction_window: 1h
    max_block_bytes: 104857600
    block_retention: 24h

metrics_generator:
  ring:
    kvstore:
      store: inmemory
  storage:
    path: /tmp/tempo/generator/wal
  registry:
    external_labels:
      source: tempo

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9095

query_frontend:
  trace_by_id:
    max_concurrent_requests: 2
  search:
    max_concurrent_requests: 1
    default_result_limit: 20

overrides:
  metrics_generator_processors:
    - service-graphs
    - span-metrics

