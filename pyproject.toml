[project]
name = "bookclub-local-poc"
version = "0.1.0"
description = "A tool that turns technical PDFs into flashcards and spaced-repetition decks — powered by LLM + retrieval — to help engineers retain and apply what they read."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.13.3",
]
